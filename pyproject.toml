[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-adaptive-router"
version = "0.1.0"
description = "A local, model-agnostic routing CLI for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "codex-adaptive-router contributors" }]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["ruff>=0.14"]

[project.scripts]
cx = "codex_adaptive_router.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_adaptive_router = ["defaults.json", "evaluation_cases.json", "orchestration_evaluation_cases.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
